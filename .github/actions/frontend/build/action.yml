name: "Frontend Build"
description: "Build the frontend"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      shell: bash
      run: npm ci
      working-directory: frontend
    - name: Build frontend
      shell: bash
      run: npm run build
      working-directory: frontend
