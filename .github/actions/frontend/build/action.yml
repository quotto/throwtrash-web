name: "Frontend Build"
description: "Build the frontend"
inputs:
  frontend-stage:
    description: "The frontend stage"
    required: true
  api-base:
    description: "The API base for frontend (CloudFront path base)"
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Restore frontend cache
      uses: actions/cache@v4
      with:
        path: frontend/node_modules
        key: npm-deps-${{ github.ref_name }}-${{ hashFiles('frontend/package-lock.json') }}
    - name: Install dependencies
      shell: bash
      run: npm ci
      working-directory: frontend
    - name: Build frontend
      shell: bash
      run: npm run build
      working-directory: frontend
      env:
        FRONTEND_STAGE: ${{ inputs.frontend-stage }}
        NEXT_PUBLIC_API_BASE: ${{ inputs.api-base }}
