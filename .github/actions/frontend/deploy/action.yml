name: "Frontend Deploy"
description: "Deploy the frontend"
inputs:
  app-id:
    description: "Amplify App ID"
    required: true
  branch-name:
    description: "Amplify branch name"
    required: true
runs:
  using: composite
  steps:
    - name: Trigger Amplify job
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        BRANCH: ${{ inputs.branch-name }}
      run: |
        echo "Starting Amplify deployment: app=$APP_ID branch=$BRANCH"
        aws amplify start-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-type RELEASE
