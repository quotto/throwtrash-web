name: Production Deploy
on:
  push:
    branches:
    - deploy
permissions:
  contents: read
  id-token: write

jobs:
  get-pr-number:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.findPr.outputs.pr }}
    steps:
      - uses: jwalton/gh-find-current-pr@master
        id: findPr
        with:
          state: closed
      - name: Set PR number
        run: echo "pr_number=${{ steps.findPr.outputs.pr }}" >> $GITHUB_OUTPUT
  frontend-deploy:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-frontend-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - uses: ./.github/actions/frontend/build
        with:
          front-stage: ${{ vars.FRONT_STAGE }}
          api-base: ${{ vars.CF_DOMAIN_NAME }}/backend/${{ vars.BACK_STAGE }}
      - uses: ./.github/actions/frontend/deploy
        with:
          front-stage: ${{ vars.FRONT_STAGE }}
          bucket: throwtrash
  backend-deploy:
    needs: ["get-pr-number"]
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Backend ChangeSet Execute
        run: |
          aws cloudformation execute-change-set --change-set-name deploy-${{ needs.get-pr-number.outputs.pr_number }} --stack-name throwtrash-backend-${{ vars.BACK_STAGE }} --region ${{ vars.AWS_DEFAULT_REGION }}
  mobile-backend-deploy:
    needs: ["get-pr-number"]
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-api-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Mobile Backend ChangeSet Execute
        run: |
          aws cloudformation execute-change-set --change-set-name deploy-${{ needs.get-pr-number.outputs.pr_number }} --stack-name throwtrash-mobile-${{ vars.MOBILE_API_STAGE }} --region ${{ vars.AWS_DEFAULT_REGION }}

  cloudfront-deploy:
    needs: ["frontend-deploy", "backend-deploy", "mobile-backend-deploy"]
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWS Set up
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/throwtrash-frontend-deploy-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra/cdk
      - name: Deploy CloudFront (primary)
        env:
          CF_STAGE: prod
          CF_DOMAIN_NAME: ${{ vars.CF_DOMAIN_NAME }}
          CF_CERT_ARN: ${{ vars.CF_CERT_ARN }}
          CF_FRONTEND_BUCKET: throwtrash
        run: |
          BACKEND_DOMAIN=$(aws cloudformation describe-stacks --stack-name throwtrash-backend-${{ vars.BACK_STAGE }} --query "Stacks[0].Outputs[?OutputKey=='BackendApiDomain'].OutputValue" --output text --region ${{ vars.AWS_DEFAULT_REGION }})
          MOBILE_DOMAIN=$(aws cloudformation describe-stacks --stack-name throwtrash-mobile-${{ vars.MOBILE_API_STAGE }} --query "Stacks[0].Outputs[?OutputKey=='MobileApiDomain'].OutputValue" --output text --region ${{ vars.AWS_DEFAULT_REGION }})
          export CF_BACKEND_API_DOMAIN="${BACKEND_DOMAIN}"
          export CF_MOBILE_API_DOMAIN="${MOBILE_DOMAIN}"
          export CF_BACKEND_API_STAGE="${{ vars.BACK_STAGE }}"
          export CF_MOBILE_API_STAGE="${{ vars.MOBILE_API_STAGE }}"
          npx cdk deploy throwtrash-cloudfront-prod --context stage=prod --require-approval never
        working-directory: infra/cdk
      - name: Invalidate CloudFront cache
        env:
          STACK_NAME: throwtrash-cloudfront-prod
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text --region us-east-1)
          aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*" --region us-east-1
