version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || (. "$NVM_DIR/nvm.sh" && nvm use 20) || true
            - npm ci
        build:
          commands:
            - echo "API_HOST=$API_HOST" >> .env
            - echo "API_STAGE=$API_STAGE" >> .env
            - npm run lint
            - npm run test -- --runInBand
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/**
    appRoot: frontend
