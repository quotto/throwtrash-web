version: 1
applications:
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - nvm use 20 || (. "$NVM_DIR/nvm.sh" && nvm use 20) || true
        - npm ci
    build:
      commands:
        - npm run lint
        - npm run test:unit -- --runInBand
        - npm run build
  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/**
